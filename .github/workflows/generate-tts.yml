name: Generate queued boy voice

on:
  workflow_dispatch:
  schedule:
    - cron: '2/5 * * * *'

permissions:
  contents: write

concurrency:
  group: generate-queued-tts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install voice generator
        run: npm install node-edge-tts@1.2.12 --no-save
      - name: Generate queued audio
        run: node tools/generate-queued-tts.mjs
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated-tts
          if ! git diff --cached --quiet; then
            git commit -m "自动生成男孩语音"
            git push
          fi
      - name: Mark queue as generated
        run: node tools/mark-queued-tts.mjs
