<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f1e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="字时光" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>字时光 · 识字复习</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="todayLabel"></p>
        <h1>字时光 <span>✦</span></h1>
      </div>
      <button class="icon-button" id="openAdd" aria-label="添加汉字">＋</button>
    </header>

    <section class="hero" aria-labelledby="heroTitle">
      <div>
        <p>今日复习</p>
        <strong id="dueCount">0</strong><span> 个字</span>
      </div>
      <div class="streak">
        <span>🔥</span>
        <div><b id="streakCount">0 天</b><small>连续复习</small></div>
      </div>
    </section>

    <section id="homeView" class="view active">
      <button class="primary-button" id="startReview">
        <span>开始今日复习</span><span class="arrow">→</span>
      </button>

      <div class="section-heading">
        <h2>我的字库</h2>
        <span id="totalCount">0 个字</span>
      </div>
      <div id="wordList" class="word-list"></div>
      <div id="emptyLibrary" class="empty-state">
        <div class="empty-mark">字</div>
        <h3>字库还是空的</h3>
        <p>添加今天认识的新字，明天也来见见它。</p>
        <button class="text-button" id="emptyAdd">添加第一个字</button>
      </div>
    </section>

    <section id="reviewView" class="view review-view" aria-live="polite">
      <div class="review-top">
        <button class="back-button" id="exitReview">← 退出</button>
        <span id="reviewProgress">1 / 1</span>
      </div>
      <div class="progress-track"><div id="progressBar"></div></div>

      <div id="reviewStage" class="review-stage">
        <article id="wordCard" class="word-card" tabindex="0" role="button" aria-label="点击显示提示">
          <span class="card-hint">点一下，看看提示</span>
          <div class="big-word" id="reviewWord">字</div>
          <div class="memory-cue" id="memoryCue"></div>
          <span class="card-date" id="reviewDate"></span>
        </article>
      </div>

      <div class="rating-panel">
        <p>这个字你记得怎么样？</p>
        <div class="rating-buttons">
          <button data-rating="1"><span>🌱</span><b>再练练</b><small>今天再来</small></button>
          <button data-rating="2"><span>🙂</span><b>有点熟</b><small>2 天后</small></button>
          <button data-rating="3"><span>⭐</span><b>掌握了</b><small>7 天后</small></button>
        </div>
      </div>
    </section>

    <section id="completeView" class="view complete-view">
      <div class="celebration">🎉</div>
      <p class="eyebrow">今日完成</p>
      <h2>每次见面，<br />都会更熟一点。</h2>
      <p id="completeSummary"></p>
      <button class="primary-button" id="backHome">回到首页</button>
    </section>
  </main>

  <dialog id="addDialog">
    <form id="addForm" method="dialog">
      <div class="dialog-head">
        <div><p class="eyebrow">记录新认识</p><h2>添加汉字</h2></div>
        <button type="button" class="close-button" id="closeAdd">×</button>
      </div>
      <label for="wordInput">今天认识了哪些字？</label>
      <textarea id="wordInput" rows="3" placeholder="例如：春 风 花 月" required></textarea>
      <p class="field-help">可以连续输入，也可以用空格或逗号隔开</p>
      <label for="wordDate">认识日期</label>
      <input id="wordDate" type="date" required />
      <label for="wordNote">小提示 <span>（选填）</span></label>
      <input id="wordNote" type="text" maxlength="30" placeholder="例如：春天的春" />
      <button class="primary-button" type="submit">放进字库</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
