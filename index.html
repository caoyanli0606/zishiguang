<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f1e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="字时光" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=20" />
  <title>字时光 · 识字复习</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="todayLabel"></p>
        <h1>字时光 <span>✦</span></h1>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="openAdd" aria-label="添加汉字">＋</button>
      </div>
    </header>

    <section class="hero" aria-labelledby="heroTitle">
      <div>
        <p>今日复习</p>
        <strong id="dueCount">0</strong><span> 个字</span>
      </div>
      <div class="streak">
        <span>🔥</span>
        <div><b id="streakCount">0 天</b><small>连续复习</small></div>
      </div>
    </section>

    <section id="homeView" class="view">
      <button class="primary-button" id="startReview">
        <span>开始今日复习</span><span class="arrow">→</span>
      </button>
      <button class="secondary-button" id="homeReviewAgain" type="button" hidden>
        <span>再复习一遍</span><span>↻</span>
      </button>

      <div class="section-heading">
        <h2 id="libraryTitle">录入字库</h2>
        <span id="totalCount">0 个字</span>
      </div>
      <div class="library-tabs" role="tablist" aria-label="字库类型">
        <button class="active" id="addedTab" type="button" role="tab" aria-selected="true">录入字库</button>
        <button id="reviewedTab" type="button" role="tab" aria-selected="false">复习记录</button>
      </div>
      <div class="date-filter">
        <button class="filter-all active" id="allDates" type="button">全部日期</button>
        <label for="libraryDate">选择日期</label>
        <input id="libraryDate" type="date" />
      </div>
      <div id="wordList"></div>
      <div id="emptyLibrary" class="empty-state">
        <div class="empty-mark">字</div>
        <h3 id="emptyLibraryTitle">字库还是空的</h3>
        <p id="emptyLibraryText">添加今天认识的新字，明天也来见见它。</p>
        <button class="text-button" id="emptyAdd">添加第一个字</button>
      </div>
    </section>

    <section id="reviewView" class="view review-view" aria-live="polite">
      <div class="review-top">
        <button class="back-button" id="exitReview">← 退出</button>
        <span id="reviewProgress">1 / 1</span>
      </div>
      <div class="progress-track"><div id="progressBar"></div></div>

      <div id="reviewStage" class="review-stage">
        <article id="wordCard" class="word-card" tabindex="0" role="button" aria-label="点击显示提示">
          <span class="card-hint">点一下，看看提示</span>
          <div class="big-word" id="reviewWord">字</div>
          <button class="speak-button" id="speakWord" type="button" aria-label="朗读这个字">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5l4.5 4V5.5l-4.5 4H4Zm11.3-.9a5 5 0 0 1 0 6.8M17.8 6a8.5 8.5 0 0 1 0 12" /></svg>
            <span>听读音</span>
          </button>
          <div class="memory-cue" id="memoryCue"></div>
          <span class="card-date" id="reviewDate"></span>
        </article>
      </div>

      <div class="rating-panel">
        <p>这个字你记得怎么样？</p>
        <div class="rating-buttons">
          <button data-rating="1"><span>🌱</span><b>再练练</b><small>今天再来</small></button>
          <button data-rating="2"><span>🙂</span><b>有点熟</b><small>2 天后</small></button>
          <button data-rating="3"><span>⭐</span><b>认识</b><small>7 天后</small></button>
        </div>
      </div>
    </section>

    <section id="completeView" class="view complete-view">
      <div class="celebration">🎉</div>
      <p class="eyebrow">今日完成</p>
      <h2>每次见面，<br />都会更熟一点。</h2>
      <p id="completeSummary"></p>
      <button class="primary-button" id="reviewAgain">再复习一遍</button>
      <button class="primary-button" id="backHome">回到首页</button>
    </section>

    <section id="textbookView" class="view textbook-view active">
      <div class="textbook-banner">
        <div><p>课本识字</p><strong id="textbookTotal">0</strong><span> 个字</span></div>
        <div class="book-mark">课</div>
      </div>
      <div class="section-heading textbook-heading">
        <div><p class="eyebrow">小学识字表</p><h2>选择课本</h2></div>
        <button class="mini-add-button" id="addTextbook" type="button">＋ 录入</button>
      </div>
      <div class="textbook-summary">
        <span>全部课本共 <b id="filteredTextbookCount">0</b> 个字</span>
        <span>已认识 <b id="knownTextbookCount">0</b> 个</span>
      </div>
      <button class="primary-button textbook-review-button" id="startTextbookReview" type="button">按顺序复习全部识字表</button>
      <div class="lesson-review-tools" id="lessonReviewTools" hidden>
        <div><b>组合课时</b><span>已选 <strong id="selectedLessonCount">0</strong> 个课时</span></div>
        <button id="toggleAllLessons" type="button">全选</button>
      </div>
      <button class="shuffle-review-button" id="shuffleLessonReview" type="button" hidden>乱序复习已选课时</button>
      <div id="textbookWordList" class="textbook-groups"></div>
      <div id="emptyTextbook" class="empty-state">
        <div class="empty-mark">课</div>
        <h3>还没有课本识字表</h3>
        <p>选择年级和册别，批量录入课本中的生字。</p>
        <button class="text-button" id="emptyTextbookAdd" type="button">录入第一份识字表</button>
      </div>
    </section>

    <nav class="main-nav" id="mainNav" aria-label="主要功能">
      <button id="homeNav" type="button"><span>◉</span><b>今日</b></button>
      <button class="active" id="textbookNav" type="button"><span>田</span><b>课本识字</b></button>
    </nav>
  </main>

  <dialog id="addDialog">
    <form id="addForm" method="dialog">
      <div class="dialog-head">
        <div><p class="eyebrow">记录新认识</p><h2>添加汉字</h2></div>
        <button type="button" class="close-button" id="closeAdd">×</button>
      </div>
      <label for="wordInput">今天认识了哪些字？</label>
      <textarea id="wordInput" rows="3" placeholder="例如：春 风 花 月" required></textarea>
      <p class="field-help">可以连续输入，也可以用空格或逗号隔开</p>
      <label for="wordDate">认识日期</label>
      <input id="wordDate" type="date" required />
      <label for="wordNote">小提示 <span>（选填）</span></label>
      <input id="wordNote" type="text" maxlength="30" placeholder="例如：春天的春" />
      <button class="primary-button" type="submit">放进字库</button>
    </form>
  </dialog>

  <dialog id="textbookDialog">
    <form id="textbookForm" method="dialog">
      <div class="dialog-head">
        <div><p class="eyebrow">小学识字表</p><h2 id="textbookDialogTitle">录入课本生字</h2></div>
        <button type="button" class="close-button" id="closeTextbook">×</button>
      </div>
      <div class="textbook-form-row">
        <div><label for="textbookGrade">年级</label><select id="textbookGrade" required>
          <option value="1">一年级</option><option value="2">二年级</option><option value="3">三年级</option>
          <option value="4">四年级</option><option value="5">五年级</option><option value="6">六年级</option>
        </select></div>
        <div><label for="textbookSemester">册别</label><select id="textbookSemester" required><option value="1">上册</option><option value="2">下册</option></select></div>
      </div>
      <label for="textbookUnit">课时名称</label>
      <input id="textbookUnit" type="text" maxlength="20" placeholder="例如：第 1 课、识字 1" required />
      <label for="textbookInput">课本中的生字</label>
      <textarea id="textbookInput" rows="4" placeholder="可以连续粘贴：天地人你我他" required></textarea>
      <p class="field-help">自动提取汉字并去重；相同年级和册别中不会重复添加。</p>
      <button class="primary-button" id="textbookSubmit" type="submit">保存识字表</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="cloud-config.js?v=20"></script>
  <script src="app.js?v=20"></script>
</body>
</html>
